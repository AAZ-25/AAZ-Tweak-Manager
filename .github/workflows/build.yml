name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/.theos-build

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install build tools
        run: |
          brew install ldid xz
          brew install dpkg || brew link --overwrite dpkg
      - name: Install project sources
        run: |
          rm -rf "$THEOS"
          git clone --filter=blob:none --no-checkout https://github.com/theos/theos.git "$THEOS"
          git -C "$THEOS" checkout 5280bd038207e14f8bd76f5417aa2fe641c03228
          git -C "$THEOS" submodule update --init --recursive
          git clone --filter=blob:none --no-checkout https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
          git -C "$RUNNER_TEMP/sdks" checkout 0222fd5413cf4b9af096f37b4621afa2688572f7
          cp -R "$RUNNER_TEMP/sdks/"*.sdk "$THEOS/sdks/"
      - name: Verify source
        run: python3 Tests/verify.py
      - name: Build package
        run: make clean package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
      - name: Verify package
        run: |
          DEB="$(find packages -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "com.aaz.tweakmanager"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.1.0~beta15"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64"
          dpkg-deb -c "$DEB" | grep -q 'AAZTweakManager.app/AAZTweakManager'
          dpkg-deb -c "$DEB" | grep -q 'AAZTweakManager.app/AppIcon60x60@3x.png'
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/aaz-package"
          file "$RUNNER_TEMP/aaz-package/var/jb/Applications/AAZTweakManager.app/AAZTweakManager" | grep -q 'arm64'
          strings "$RUNNER_TEMP/aaz-package/var/jb/Applications/AAZTweakManager.app/AAZTweakManager" > "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Select All' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Unselect All' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Search packages' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Create Backup?' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Selection Updated' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Backup Summary' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Encrypted Backup' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Backup Health & Readiness' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Selection Profiles' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Manage Profiles' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Importing Backup' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'picker-opened' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'open-in-received' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'x.com/_kkk2' "$RUNNER_TEMP/aaz-app.strings"
          grep -Fq 'Only a healthy backup can be imported' "$RUNNER_TEMP/aaz-app.strings"
          cp "$DEB" AAZ-Tweak-Manager-rootless.deb
          shasum -a 256 AAZ-Tweak-Manager-rootless.deb
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AAZ-Tweak-Manager-rootless
          path: AAZ-Tweak-Manager-rootless.deb
          if-no-files-found: error
